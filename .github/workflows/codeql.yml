# CodeQL 安全扫描工作流（v4 版）
# 说明：升级到 v4，保留 Android 项目必需的手动构建（build-mode: manual）

name: "CodeQL"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'deps.txt'
      - 'scripts/**'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'deps.txt'
      - 'scripts/**'
  schedule:
    - cron: "0 2 * * 1"   # 每周一 02:00 例行扫描

# 新推送取消尚未结束的旧扫描。
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin", "javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 跨运行持久化依赖 + Gradle 构建缓存，使 CodeQL 的构建复用已编译产物。
      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v4
        with:
          # 允许在 PR 分支写入自己的缓存条目，使同分支后续推送命中热缓存。
          cache-read-only: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build (Android)
        if: matrix.language == 'java-kotlin'
        # 只需编译供 CodeQL 抽取，跳过 dex/打包/lint；:app:compileDebugSources 会
        # 传递编译全部依赖模块。
        run: >-
          ./gradlew :app:compileDebugSources
          --build-cache --max-workers=4
          -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvmargs="-Xmx2g"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: ${{ matrix.language }}
          upload: true
