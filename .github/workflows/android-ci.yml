name: Android CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'deps.txt'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'deps.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Merge pull request')

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Debug available SDK platforms
      run: sdkmanager --channel=3 --list 2>&1 | grep -iE "platforms;android|build-tools;3[5-9]" || true

    - name: Install compile SDK
      run: sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Run Lint
      run: ./gradlew lintDebug

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/build/reports/tests/**'

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: '**/build/reports/lint-results-debug.html'

    # 专用性能设备执行 aggregateMacrobenchmarkResults 后，常规 CI 也会保留同一路径的结果。
    - name: Upload Macrobenchmark Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macrobenchmark-reports
        path: 'benchmark/build/reports/macrobenchmark/**'
        if-no-files-found: ignore

  release-smoke:
    name: Minified release/native gate
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android and native verification tools
      run: sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0" "ndk;27.2.12479018"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build minified releaseSmoke and run APK gates
      run: ./gradlew :app:releaseSmoke -Pdawn.releaseSmoke=true

    - name: Upload releaseSmoke APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-smoke-apk-do-not-distribute
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
