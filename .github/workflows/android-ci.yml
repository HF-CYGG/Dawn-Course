name: Android CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'deps.txt'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'deps.txt'

# 同一分支/PR 的新推送取消尚未结束的旧运行，避免排队浪费并更快拿到最终结果。
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Merge pull request')

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # setup-gradle 跨运行持久化依赖缓存 + Gradle 构建缓存 + 配置缓存，
    # 比 setup-java 的 cache: gradle（仅依赖）显著减少重复编译。
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # 允许在 PR 分支写入自己的缓存条目，使同分支后续推送命中热缓存。
        cache-read-only: false

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install compile SDK
      run: sdkmanager --channel=3 "platforms;android-37.2" "build-tools;36.0.0"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 单次调用共享一次配置阶段与守护进程，避免三次分开调用重复配置整个多模块构建。
    - name: Build, test and lint
      run: >-
        ./gradlew assembleDebug testDebugUnitTest lintDebug
        --build-cache --max-workers=4
        -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvmargs="-Xmx2g"

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/build/reports/tests/**'

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: '**/build/reports/lint-results-debug.html'

    # 专用性能设备执行 aggregateMacrobenchmarkResults 后，常规 CI 也会保留同一路径的结果。
    - name: Upload Macrobenchmark Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macrobenchmark-reports
        path: 'benchmark/build/reports/macrobenchmark/**'
        if-no-files-found: ignore

  release-smoke:
    name: Minified release/native gate
    # 与 build 相互独立，不再串行等待，直接并行以缩短 PR 总时长。
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'Merge pull request')

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android and native verification tools
      run: sdkmanager --channel=3 "platforms;android-37.2" "build-tools;36.0.0" "ndk;27.2.12479018"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build minified releaseSmoke and run APK gates
      run: >-
        ./gradlew :app:releaseSmoke -Pdawn.releaseSmoke=true
        --build-cache --max-workers=4
        -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8" -Dkotlin.daemon.jvmargs="-Xmx2g"

    - name: Upload releaseSmoke APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-smoke-apk-do-not-distribute
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
