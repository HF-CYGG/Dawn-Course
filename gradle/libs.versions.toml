# 版本定义 (Versions)
[versions]
# Android 16 / compileSdk 37 构建线：JVM 17 与 AGP 9.3 已在本分支验证。
agp = "9.3.1" # Android Gradle Plugin
kotlin = "2.2.10" # 与 AGP 内置 Kotlin/Compose 插件保持一致
core-ktx = "1.19.0" # Android Core KTX 扩展
junit = "4.13.2" # 单元测试框架
androidx-test-ext-junit = "1.3.0" # Android JUnit 扩展
androidx-test-runner = "1.7.0" # Android instrumentation runner
espresso-core = "3.7.0" # UI 测试框架
lifecycle-runtime-ktx = "2.11.0" # Lifecycle KTX (ViewModel, LiveData 等)
activity-compose = "1.13.0" # Compose Activity 支持
compose-bom = "2026.08.00" # Compose Bill of Materials (BOM) 版本控制
hilt = "2.60.1" # Hilt 依赖注入框架
room = "2.8.4" # Room 数据库框架
sqlcipher = "4.18.0" # maintained sqlcipher-android；支持 Android 16 KB page size
ksp = "2.3.11" # 吸收 origin/main 的 KSP 修复版本
coroutines = "1.10.2" # Kotlin 协程
navigation-compose = "2.9.8" # Compose 导航组件
glance = "1.1.1" # 桌面小组件 (Widget) 框架
work = "2.11.2" # WorkManager 后台任务
datastore = "1.2.1" # DataStore 数据存储
quickjs = "3.2.3" # maintained QuickJS wrapper；通过四 ABI/16 KB 预核验
androidx-hilt = "1.4.0" # AndroidX Hilt：Compose 与 WorkManager 集成
javax-inject = "1" # Java 注入标准注解
coil = "2.7.0" # 图片加载框架
security-crypto = "1.1.0" # AndroidX Security Crypto
startup-runtime = "1.2.0" # App Startup
benchmark = "1.5.0-rc01" # 1.4.x 不兼容 AGP 9 新 DSL；RC01 为当前官方 AGP 9 兼容线
uiautomator = "2.4.0" # Macrobenchmark UI 驱动
core-splashscreen = "1.2.0" # Android 12+ SplashScreen 兼容层

# Security Fixes (Dependabot)
netty = "4.2.16.Final"
bouncycastle = "1.83"
jose4j = "0.9.6"
commons-compress = "1.28.0"
commons-io = "2.22.0"
protobuf = "4.35.1"
jdom = "2.0.6.1"
guava = "33.6.0-android"
gson = "2.13.2"
jsoup = "1.23.1"
palette = "1.0.0"

# 库依赖定义 (Libraries)
[libraries]
# AndroidX Core
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# Lifecycle
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle-runtime-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

# Compose (通过 BOM 管理版本)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
ui = { group = "androidx.compose.ui", name = "ui" }
ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
material3 = { group = "androidx.compose.material3", name = "material3" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Hilt Dependency Injection
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidx-hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidx-hilt" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidx-hilt" }

# Room Database
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Misc
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javax-inject" }
quickjs-android = { group = "wang.harlon.quickjs", name = "wrapper-android", version.ref = "quickjs" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
security-crypto = { group = "androidx.security", name = "security-crypto-ktx", version.ref = "security-crypto" }
androidx-startup-runtime = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup-runtime" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }

# Security Fixes (Dependabot)
netty-codec-http2 = { group = "io.netty", name = "netty-codec-http2", version.ref = "netty" }
netty-handler = { group = "io.netty", name = "netty-handler", version.ref = "netty" }
netty-codec = { group = "io.netty", name = "netty-codec", version.ref = "netty" }
bouncycastle-prov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commons-compress" }
commons-io = { group = "commons-io", name = "commons-io", version.ref = "commons-io" }
protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
jdom = { group = "org.jdom", name = "jdom2", version.ref = "jdom" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
palette-ktx = { group = "androidx.palette", name = "palette-ktx", version.ref = "palette" }

# Networking
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version = "2.11.0" }
converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version = "2.11.0" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version = "4.12.0" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version = "4.12.0" }

# Future Phases (Widget & WorkManager)
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# 插件定义 (Plugins)
[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidTest = { id = "com.android.test", version.ref = "agp" }
baselineProfile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
hiltAndroid = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
