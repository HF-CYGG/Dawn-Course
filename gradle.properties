org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# AGP 9.0+ 内置 Kotlin（Built-in Kotlin）不允许通过 kotlin.sourceSets DSL 追加源目录，
# 而 KSP Gradle 插件正是用该方式注册 build/generated/ksp/** 生成目录。
# 官方迁移指南给出的过渡开关：https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
# AGP 9.1.0 官方仅"测试到" compileSdk 36.1；compileSdk 37 可正常编译，仅需抑制该提示。
# 后续 AGP 升到官方支持 37 的版本后可移除。
android.suppressUnsupportedCompileSdk=37.0
org.gradle.workers.max=4
org.gradle.vfs.watch=false
